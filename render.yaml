services:
  - type: web
    name: kramer-generator-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # Najwyższy priorytet na Renderze; musi być pełna wersja (np. 3.12.8). Zgodne z .python-version w root.
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_PATH
        value: /tmp/offers.db
      - key: PDF_DIR
        value: /tmp/pdfs
      - key: COMPANY_ADDRESS
        value: "ul. Szkolna 20
62-001 Chludowo k. Poznania"
      - key: COMPANY_NIP
        value: "766-178-66-79"
      - key: COMPANY_PHONE
        value: "+48 604 127 881"
      - key: COMPANY_EMAIL
        value: "sklep@siatki-kramer.pl"
      - key: COMPANY_WEBSITE
        value: "https://sklep.siatki-kramer.pl"
      - key: COMPANY_NAME
        value: "Siatki Kramer"
      - key: SENDER_NAME
        value: "Siatki Kramer"
      # E-mail — wpisz ręcznie w dashboardzie Render (Settings → Environment)
      # - key: SMTP_HOST
      # - key: SMTP_PORT
      # - key: SMTP_USER
      # - key: SMTP_PASSWORD
